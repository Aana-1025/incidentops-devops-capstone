nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/aana-1025/incidentops-backend
    tag: 85b40da4d8bde943610e3e587a58028761151e18
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    scaleUpStabilizationSeconds: 0
    scaleDownStabilizationSeconds: 60

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/aana-1025/incidentops-frontend
    tag: 85b40da4d8bde943610e3e587a58028761151e18
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

postgresql:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    database: incidentops
    username: incidentops
    password: development-only-change-me
  service:
    port: 5432
  persistence:
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
  labels:
    app.kubernetes.io/part-of: incidentops

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: ""
