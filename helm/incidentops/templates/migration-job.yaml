apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "incidentops.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "incidentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "incidentops.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - sh
            - -ec
          args:
            - |
              until python -c "import os; from sqlalchemy import create_engine, text; connection = create_engine(os.environ['DATABASE_URL']).connect(); connection.execute(text('SELECT 1')); connection.close()"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              python -m alembic upgrade head
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "incidentops.fullname" . }}-postgresql
                  key: password
            - name: DATABASE_URL
              value: {{ include "incidentops.databaseUrl" . | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
