apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentops-wrong-service-demo
  namespace: incidentops
  labels:
    app.kubernetes.io/name: incidentops-wrong-service-demo
    app.kubernetes.io/part-of: incidentops-troubleshooting
    incidentops.io/scenario: wrong-target-port
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: incidentops-wrong-service-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentops-wrong-service-demo
        app.kubernetes.io/part-of: incidentops-troubleshooting
        incidentops.io/scenario: wrong-target-port
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: ghcr.io/aana-1025/incidentops-backend:85b40da4d8bde943610e3e587a58028761151e18
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080", "--directory", "/tmp"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incidentops-wrong-service-demo
  namespace: incidentops
  labels:
    app.kubernetes.io/name: incidentops-wrong-service-demo
    app.kubernetes.io/part-of: incidentops-troubleshooting
    incidentops.io/scenario: wrong-target-port
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incidentops-wrong-service-demo
  ports:
    - name: http
      port: 80
      targetPort: 9999
