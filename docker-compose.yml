name: incidentops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentops
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: incidentops
    ports:
      - "5433:5432"
    volumes:
      - incidentops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops -d incidentops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    image: incidentops-backend:local
    build:
      context: ./backend
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+psycopg://incidentops:incidentops@postgres:5432/incidentops
      DATABASE_CONNECT_TIMEOUT_SECONDS: 3
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped

  frontend:
    image: incidentops-frontend:local
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  incidentops-postgres-data:
    name: incidentops-postgres-data
