name: incidentops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentops
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: incidentops
    ports:
      - "5433:5432"
    volumes:
      - incidentops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops -d incidentops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  incidentops-postgres-data:
    name: incidentops-postgres-data
